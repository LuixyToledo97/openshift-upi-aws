---
# Project default values — hand-maintained, NOT touched by `ocplab render`.
# Whatever varies per cluster (name, network, sizes...) lives in
# generated.yml, which `ocplab render` does generate from cluster.yaml.

# playbook_dir is the directory of the currently-running .yml file itself
# (ansible/playbooks/), not 'ansible/' — it takes TWO levels up to reach
# the repo root. With just one, everything derived from this (install_dir,
# archive_dir, terraform_dir) points inside ansible/ without raising any
# error — this was discovered by running the ignition role for real and
# seeing it write to ansible/install-dir instead of install-dir/.
ocplab_repo_root: "{{ playbook_dir }}/../.."
ocplab_install_dir: "{{ ocplab_repo_root }}/install-dir"
ocplab_archive_dir: "{{ ocplab_repo_root }}/archive"
ocplab_terraform_dir: "{{ ocplab_repo_root }}/terraform"
# Used by both finalize and teardown — a single place to derive it.
ocplab_kubeconfig: "{{ ocplab_install_dir }}/auth/kubeconfig"

# Tag that locates all of the lab's resources in AWS (VPC, instances, NAT,
# ELBs...). Used by both teardown and the killswitch.
ocplab_project_tag: openshift-lab

# The lab's "working" IAM user. Created by the bootstrap role and locked
# down (temporarily, via an IAM policy) by the safety_net role once the
# budget goes over 80% — both need the same name.
ocplab_iam_user_name: openshift-lab-terraform

# Ignition certificates expire after 24h — past that, install-dir has to
# be archived and regenerated clean.
ocplab_ignition_max_age_hours: 24

# Fallbacks for the managed binaries. `ocplab render` overrides these in
# generated.yml (which wins, being later alphabetically in the same
# group_vars directory) with absolute paths into ~/.ocplab/bin/<version>
# whenever cluster.yaml declares openshift.version. The bare names here mean
# "whatever is on the PATH", which is both the behaviour before versions were
# manageable and what still applies when no version is declared — so a
# generated.yml written by an older ocplab doesn't leave these undefined.
ocplab_openshift_install_bin: openshift-install
ocplab_oc_bin: oc
ocplab_openshift_version: ""

# How many times to run "openshift-install wait-for bootstrap-complete"
# before giving up. NOT a timeout: the ~20-minute limit is internal to
# openshift-install and can't be extended by any flag, so waiting longer means
# running it again. It's a monitor, not an action, so re-running is free and
# reattaches to the cluster's real state. 3 attempts ≈ an hour of patience,
# which covers a bootstrap slowed down by pulling operator images over NAT.
ocplab_bootstrap_wait_attempts: 3

# Wait times (seconds), aligned with scripts/teardown.sh.
ocplab_elb_teardown_timeout: 300
ocplab_elb_teardown_poll_interval: 10
# The Classic router ELB disappears from the AWS API almost immediately
# (see ocplab_elb_teardown_timeout above), but AWS releases its
# amazon-elb-owned ENIs and their public IPs in the background on a much
# longer, looser timeline — found running this for real, where it took
# over 35 minutes. 1200s (20min) is a generous bound for that; if it's
# still not enough, 'ocplab destroy' is idempotent and safe to re-run.
ocplab_eni_teardown_timeout: 1200

# The orphaned k8s-elb-* security group can't be deleted until AWS releases
# whatever the router ELB still had attached to it, which does not happen the
# instant the ELB disappears. Worth waiting for: Terraform cannot delete a VPC
# that still contains a security group it doesn't manage, so giving up here
# turns into a twenty-minute stall on the VPC with no visible cause.
ocplab_sg_teardown_timeout: 600
ocplab_sg_teardown_poll_interval: 15

# Worker CSR approval: two rounds (client, then server), with a wait
# between them so the kubelet has time to request the second CSR.
ocplab_csr_approval_rounds: 2
ocplab_csr_round_wait_seconds: 180
