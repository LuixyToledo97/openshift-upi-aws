[defaults]
inventory       = inventory/localhost.yml
roles_path      = roles
collections_path = ~/.ansible/collections
host_key_checking = False
retry_files_enabled = False
callback_plugins = callback_plugins
stdout_callback = ocplab_output
# Only takes effect when ocplab falls back to the 'default' callback, which it
# does whenever -v/-vv is passed (see run_ansible_playbook) — the raw Ansible
# output is the deliberate escape hatch from the pretty one.
callback_result_format = yaml
nocows          = 1
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
