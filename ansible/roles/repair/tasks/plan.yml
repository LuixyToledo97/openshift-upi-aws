---
# The safety gate. Everything this command is allowed to do is decided here,
# before a single resource is touched.
#
# The gate does NOT work by demanding a clean plan, because a healthy cluster
# never has one. Two kinds of drift are permanent and expected:
#
#   - The bootstrap instance. cluster_boot destroys it with -target once the
#     cluster is up, so it is absent from state forever after and a full plan
#     always wants to recreate it — along with its target group attachments,
#     which would put a dead bootstrap back into the API load balancer's
#     targets. Any `terraform apply` run by hand on a live cluster does this.
#   - The security groups. security-groups.tf reads the operator's public IP
#     from checkip.amazonaws.com on every plan, so the "SSH from my IP" rules
#     differ the moment that IP changes.
#
# So repair decides what it wants, and applies exactly that with -target.
# Whatever else the plan contains is reported and left alone.

- name: Ask Terraform what it would do
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      terraform plan -no-color -input=false -json
      | python3 {{ (repair_tf_render | quote) }}
      --log {{ repair_plan_log | quote }} --raw {{ repair_plan_raw | quote }} --plan-only
    chdir: "{{ ocplab_terraform_dir }}"
    executable: /bin/bash
  register: repair_plan_run
  changed_when: false
  failed_when: false

- name: Read the plan
  ansible.builtin.set_fact:
    repair_plan: "{{ (repair_plan_run.stdout | default('') | trim) | from_json
                     if (repair_plan_run.stdout | default('') | trim | length > 0)
                     else {} }}"

- name: Fail if Terraform couldn't even produce a plan
  ansible.builtin.assert:
    that: repair_plan_run.rc == 0
    fail_msg: >-
      terraform plan failed (exit {{ repair_plan_run.rc }}).
      {{ (repair_plan.diagnostics | default([]) | map(attribute='summary') | join('; '))
         or 'See ' + repair_plan_log }}

# Matched on type AND name, never name alone: 'aws_security_group.worker' is
# also called "worker", and matching by name only classified a security-group
# update as a worker being rebuilt — refusing a perfectly good repair.
- name: Pick out the changes that concern worker instances
  ansible.builtin.set_fact:
    repair_worker_changes: >-
      {{ repair_plan.planned | default([])
         | selectattr('type', 'equalto', 'aws_instance')
         | selectattr('name', 'equalto', 'worker') | list }}

- name: Work out which workers are missing, and what else the plan wanted
  ansible.builtin.set_fact:
    repair_planned: "{{ repair_worker_changes | selectattr('action', 'equalto', 'create') | list }}"
    repair_worker_damage: "{{ repair_worker_changes | rejectattr('action', 'equalto', 'create') | list }}"
    repair_untouched: >-
      {{ repair_plan.planned | default([])
         | rejectattr('addr', 'in', repair_worker_changes | map(attribute='addr') | list) | list }}

# A worker that Terraform wants to REPLACE rather than create means the
# surviving workers no longer match the configuration — a changed RHCOS AMI
# does exactly this. Recreating a missing node is a repair; rebuilding the ones
# that are still running is not, whatever the reason.
- name: Refuse if the plan would replace or destroy a worker that still exists
  ansible.builtin.assert:
    that: repair_worker_damage | length == 0
    fail_msg: >-
      Refusing to apply: Terraform wants to
      {{ repair_worker_damage | map(attribute='action') | unique | join('/') }}
      {{ repair_worker_damage | map(attribute='addr') | join(', ') }} — workers that
      still exist. That is a rebuild, not a repair; a changed openshift.version
      moves the RHCOS AMI and does this. Inspect {{ repair_plan_log }} and decide
      deliberately — 'ocplab deploy' rebuilds from scratch if that's what you want.

- name: Show what will be recreated, and what is deliberately being left alone
  ansible.builtin.debug:
    msg: >-
      {{ ['Repairing ' + (repair_planned | length | string) + ' worker(s), by name:']
         + (repair_planned | map(attribute='addr') | map('regex_replace', '^', '  + ') | list)
         + (['',
             'Terraform also wanted to touch the following. The apply is limited with',
             '-target to the workers above, which also pulls in whatever they depend on',
             '(their security group, typically) — the rest is left alone:']
            + (repair_untouched | map(attribute='addr') | map('regex_replace', '^', '  ~ ') | list)
            if repair_untouched | length > 0 else []) }}
  when: repair_planned | length > 0

- name: Nothing is missing
  ansible.builtin.debug:
    msg: >-
      No worker is missing — Terraform accounts for every one it manages. If a
      node is unhealthy rather than absent, this isn't the command for it; check
      'ocplab verify'.
  when: repair_planned | length == 0
