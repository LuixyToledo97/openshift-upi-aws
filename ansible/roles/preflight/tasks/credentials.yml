---
- name: Query the AWS caller identity (profile "{{ ocplab_aws_profile }}")
  amazon.aws.aws_caller_info:
    profile: "{{ ocplab_aws_profile }}"
    region: "{{ ocplab_aws_region }}"
  register: preflight_caller
  ignore_errors: true

- name: Record a problem if the AWS credentials don't work
  ansible.builtin.set_fact:
    preflight_problems: "{{ preflight_problems + [\"AWS credentials: could not authenticate with profile '\" + ocplab_aws_profile + \"' (\" + (preflight_caller.msg | default('unknown error')) + \"). Check 'aws configure list --profile \" + ocplab_aws_profile + \"'.\"] }}"
  when: preflight_caller.failed | default(true)

- name: Show the authenticated account
  ansible.builtin.debug:
    msg: "AWS account {{ preflight_caller.account }} ({{ preflight_caller.arn }})"
  when: not (preflight_caller.failed | default(true))

- name: Read the pull secret
  ansible.builtin.slurp:
    src: "{{ ocplab_pull_secret_file }}"
  register: preflight_pull_secret_raw
  ignore_errors: true

- name: Record a problem if the pull secret couldn't be read
  ansible.builtin.set_fact:
    preflight_problems: "{{ preflight_problems + ['pull secret: could not read ' + ocplab_pull_secret_file + ' (' + (preflight_pull_secret_raw.msg | default('unknown error')) + ')'] }}"
  when: preflight_pull_secret_raw.failed | default(true)

- name: Check that the pull secret covers the required registries
  vars:
    preflight_pull_secret_auths: "{{ (preflight_pull_secret_raw.content | b64decode | from_json).auths.keys() | list }}"
    preflight_missing_registries: "{{ preflight_required_pull_secret_registries | difference(preflight_pull_secret_auths) }}"
  ansible.builtin.set_fact:
    preflight_problems: "{{ preflight_problems + ['pull secret: missing credentials for ' + (preflight_missing_registries | join(', '))] }}"
  when:
    - not (preflight_pull_secret_raw.failed | default(true))
    - preflight_missing_registries | length > 0
