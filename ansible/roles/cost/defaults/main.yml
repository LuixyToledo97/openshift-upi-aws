---
# ~/.ocplab/, same place credentials.pullSecretFile/certs/ already live.
cost_pricing_cache_file: "~/.ocplab/pricing-cache.json"

# On-demand prices change rarely — 7 days keeps 'ocplab cost' instant on
# every run except the first one for a given region, without going stale
# for long if AWS does reprice something.
cost_pricing_cache_max_age_hours: 168

# The AWS Pricing API takes a human-readable "location" name, not a region
# code, and there's no API to translate one into the other — this map is
# necessarily hardcoded. Standard commercial partition only (this lab has
# no reason to touch GovCloud/China, which use separate credentials and
# endpoints entirely). If 'platform.aws.region' isn't in this map, the
# role fails with a clear message rather than silently mispricing.
cost_region_location_names:
  us-east-1: "US East (N. Virginia)"
  us-east-2: "US East (Ohio)"
  us-west-1: "US West (N. California)"
  us-west-2: "US West (Oregon)"
  af-south-1: "Africa (Cape Town)"
  ap-east-1: "Asia Pacific (Hong Kong)"
  ap-south-1: "Asia Pacific (Mumbai)"
  ap-south-2: "Asia Pacific (Hyderabad)"
  ap-northeast-1: "Asia Pacific (Tokyo)"
  ap-northeast-2: "Asia Pacific (Seoul)"
  ap-northeast-3: "Asia Pacific (Osaka)"
  ap-southeast-1: "Asia Pacific (Singapore)"
  ap-southeast-2: "Asia Pacific (Sydney)"
  ap-southeast-3: "Asia Pacific (Jakarta)"
  ap-southeast-4: "Asia Pacific (Melbourne)"
  ca-central-1: "Canada (Central)"
  ca-west-1: "Canada West (Calgary)"
  eu-central-1: "EU (Frankfurt)"
  eu-central-2: "EU (Zurich)"
  eu-west-1: "EU (Ireland)"
  eu-west-2: "EU (London)"
  eu-west-3: "EU (Paris)"
  eu-north-1: "EU (Stockholm)"
  eu-south-1: "EU (Milan)"
  eu-south-2: "EU (Spain)"
  me-south-1: "Middle East (Bahrain)"
  me-central-1: "Middle East (UAE)"
  sa-east-1: "South America (Sao Paulo)"
  il-central-1: "Israel (Tel Aviv)"
