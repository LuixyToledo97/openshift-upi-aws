---
- name: List the VPC's security groups
  amazon.aws.ec2_security_group_info:
    profile: "{{ ocplab_aws_profile }}"
    filters:
      vpc-id: "{{ teardown_vpc_id }}"
  register: teardown_sg_info

# Only touch the ones Terraform does NOT manage. Its own are named
# "{{ ocplab_cluster_name }}-*"; the orphaned security group from the
# ingress-operator's router ELB is always k8s-elb-*.
- name: Note the orphaned security groups
  ansible.builtin.set_fact:
    teardown_orphan_sgs: >-
      {{ teardown_sg_info.security_groups | selectattr('group_name', 'match', '^k8s-elb-') | list }}

- name: Remove the orphaned security groups
  when: teardown_orphan_sgs | length > 0
  block:
    # The blocker is not a network interface, and waiting does not clear it.
    # Measured on 2026-08-03: zero ENIs were using the group, and it still
    # refused to delete after eleven minutes of retries. AWS reports
    # "DependencyViolation: has a dependent object" for a security group that
    # another group's RULES reference — and the ingress-operator adds exactly
    # such a rule to the node security groups, letting the router ELB reach the
    # nodes.
    #
    # So the dependency only clears when Terraform deletes the node security
    # groups, which happens after this task. Retrying here could never have
    # succeeded; the fix is to revoke the reference, not to wait longer.
    #
    # Safe to revoke: those node groups are seconds away from being destroyed
    # by the terraform destroy that follows.
    - name: Find the rules that reference them
      ansible.builtin.command:
        cmd: >-
          aws ec2 describe-security-group-rules --profile {{ ocplab_aws_profile }}
          --region {{ ocplab_aws_region }}
          --filters Name=group-id,Values={{ teardown_sg_info.security_groups
                                            | map(attribute='group_id') | join(',') }}
          --output json
      register: teardown_sg_rules_raw
      changed_when: false

    - name: Work out which ones to revoke
      ansible.builtin.set_fact:
        teardown_sg_refs: >-
          {{ (teardown_sg_rules_raw.stdout | from_json).SecurityGroupRules
             | selectattr('ReferencedGroupInfo', 'defined')
             | selectattr('ReferencedGroupInfo.GroupId', 'in',
                          teardown_orphan_sgs | map(attribute='group_id') | list)
             | list }}

    - name: Revoke them, so the orphaned groups can be deleted
      ansible.builtin.command:
        cmd: >-
          aws ec2 revoke-security-group-{{ 'egress' if item.IsEgress else 'ingress' }}
          --profile {{ ocplab_aws_profile }} --region {{ ocplab_aws_region }}
          --group-id {{ item.GroupId }}
          --security-group-rule-ids {{ item.SecurityGroupRuleId }}
      loop: "{{ teardown_sg_refs }}"
      loop_control:
        label: "{{ item.SecurityGroupRuleId }} in {{ item.GroupId }}"
      changed_when: true

    # Still retried, but briefly and as a safety net rather than a strategy:
    # with the references gone this succeeds immediately, and if something
    # genuinely is attached, the warning below explains what it will cost.
    - name: Delete the orphaned k8s-elb-* security groups
      amazon.aws.ec2_security_group:
        profile: "{{ ocplab_aws_profile }}"
        group_id: "{{ item.group_id }}"
        state: absent
      loop: "{{ teardown_orphan_sgs }}"
      loop_control:
        label: "{{ item.group_name }} ({{ item.group_id }})"
      register: teardown_sg_delete
      until: teardown_sg_delete is success
      retries: "{{ (ocplab_sg_teardown_timeout / ocplab_sg_teardown_poll_interval) | int }}"
      delay: "{{ ocplab_sg_teardown_poll_interval }}"
      ignore_errors: true

    # Said out loud, because the alternative is Terraform stalling on the VPC
    # with nothing in the output connecting the two.
    - name: Warn if one survived, since it will block the VPC
      ansible.builtin.debug:
        msg: >-
          Could not delete
          {{ teardown_sg_delete.results | default([]) | selectattr('failed', 'defined')
             | selectattr('failed') | map(attribute='item.group_id') | join(', ') }}.
          Terraform cannot delete a VPC that still contains a security group it does
          not manage, so the destroy below will stall on the VPC and eventually fail.
          The usual cause — another security group's rules referencing this one — is
          handled above, so check for network interfaces:
          'aws ec2 describe-network-interfaces --filters Name=group-id,Values=<id>'.
          Once it frees up, delete the group and re-run 'ocplab destroy'; the role is
          idempotent.
      when: >-
        teardown_sg_delete.results | default([]) | selectattr('failed', 'defined')
        | selectattr('failed') | list | length > 0
