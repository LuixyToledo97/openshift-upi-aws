<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same mark as the UI, on its own tile so it reads against any tab
       background. Geometry is the generated one: three arcs of a pointy-top
       hexagon at exact 120° rotations, gaps on alternating vertices. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4bf5"/>
      <stop offset="1" stop-color="#a897ff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.99 6.14 L5.95 10.20 L5.95 18.32"/>
    <path d="M8.97 23.54 L16.00 27.60 L23.03 23.54"/>
    <path d="M26.05 18.32 L26.05 10.20 L19.01 6.14"/>
  </g>
  <circle cx="16" cy="16" r="3.2" fill="#fff"/>
</svg>
