<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The ocplab mark. A hexagonal ring in three separate arcs around a solid
       centre: three because that is what a control plane is, separate because
       that is what user-provisioned means — you place each piece — and the
       gaps read as something that comes apart and goes back together, which is
       the loop this tool automates.
       Geometry is generated, not eyeballed: each arc spans two edges of a
       pointy-top hexagon with the gaps on alternating vertices, so the three
       are exact 120 degree rotations of one another. -->
  <defs>
    <linearGradient id="ocplab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4bf5"/>
      <stop offset="1" stop-color="#a897ff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#ocplab)"/>
  <g fill="none" stroke="#fff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.99 6.14 L5.95 10.20 L5.95 18.32"/>
    <path d="M8.97 23.54 L16.00 27.60 L23.03 23.54"/>
    <path d="M26.05 18.32 L26.05 10.20 L19.01 6.14"/>
  </g>
  <circle cx="16" cy="16" r="3.2" fill="#fff"/>
</svg>
